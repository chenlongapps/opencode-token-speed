name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs"

          const { version } = JSON.parse(readFileSync("package.json", "utf8"))
          const expectedTag = `v${version}`
          const isPrereleaseVersion = version.split("+", 1)[0].includes("-")
          const isPrereleaseRelease = process.env.RELEASE_PRERELEASE === "true"

          if (process.env.RELEASE_TAG !== expectedTag) {
            console.error(
              `Release tag ${process.env.RELEASE_TAG} does not match package version ${version}; expected ${expectedTag}.`,
            )
            process.exit(1)
          }

          if (isPrereleaseVersion !== isPrereleaseRelease) {
            console.error(
              `GitHub prerelease flag (${isPrereleaseRelease}) does not match package version ${version}.`,
            )
            process.exit(1)
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

      - name: Inspect package contents
        run: npm pack --dry-run --json

      - name: Publish stable release
        if: github.event.release.prerelease == false
        run: npm publish --access public

      - name: Publish prerelease
        if: github.event.release.prerelease == true
        run: npm publish --access public --tag next
